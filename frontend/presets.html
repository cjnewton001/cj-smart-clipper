<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Smart Clipper — Presets Pipeline</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                "brand-mint": "#00D670",
                "brand-dark": "#F8FAFC",
                "surface-card": "rgba(255, 255, 255, 0.85)",
                "surface-border": "rgba(0, 0, 0, 0.08)",
                "text-muted": "#64748B"
              },
              fontFamily: {
                sans: ["Plus Jakarta Sans", "sans-serif"],
                mono: ["Fira Code", "monospace"],
                display: ["Outfit", "sans-serif"]
              }
            }
          }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-900 min-h-screen flex flex-col font-sans antialiased pb-28 selection:bg-brand-mint selection:text-white">

<!-- TOP HEADER -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5 py-3.5 glass-panel border-b border-black/5">
    <div class="flex items-center gap-3">
        <span class="font-display font-extrabold text-base tracking-wider text-gray-900 uppercase">SMART CLIPPER</span>
        <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-brand-mint">
            <span class="w-2 h-2 rounded-full bg-brand-mint pulse-mint"></span>
            <span class="font-mono text-[10px] font-bold tracking-wider text-brand-mint uppercase">PIPELINE PRESETS</span>
        </div>
    </div>
    <div class="w-8 h-8 rounded-full border border-black/10 bg-black/5 flex items-center justify-center text-text-muted hover:text-gray-900 cursor-pointer transition-colors">
        <span class="material-symbols-outlined text-[18px]">person</span>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="flex-1 w-full max-w-lg mx-auto px-4 pt-20 flex flex-col gap-4">

    <!-- PRESET PIPELINE SELECTOR STRIP -->
    <div class="flex items-center justify-between font-mono text-[11px]">
        <span class="text-gray-900 font-bold tracking-wide">PIPELINE CONFIGURATION</span>
        <span class="px-2.5 py-1 rounded-full bg-emerald-50 border border-brand-mint text-brand-mint font-bold text-[10px]">DEFAULT ACTIVE</span>
    </div>

    <!-- PRESET CARDS -->
    <div class="flex flex-col gap-4">

        <!-- ASPECT RATIO CONTROL -->
        <section class="glass-panel rounded-xl p-4 flex flex-col gap-3 font-mono text-[11px]">
            <div class="flex items-center justify-between">
                <span class="text-gray-900 font-bold uppercase">ASPECT RATIO CROP</span>
                <span class="text-brand-mint font-bold text-[10px]">AUTO-CROP ACTIVE</span>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button type="button" class="flex flex-col items-center justify-center p-3 rounded-lg bg-gray-900 text-brand-mint border border-brand-mint font-bold text-center">
                    <span class="material-symbols-outlined text-[24px] mb-1">crop_portrait</span>
                    <span>9:16 VERTICAL</span>
                    <span class="text-[9px] opacity-75">SHORTS / REELS</span>
                </button>
                <button type="button" class="flex flex-col items-center justify-center p-3 rounded-lg glass-panel text-text-muted hover:text-gray-900 text-center border border-black/10">
                    <span class="material-symbols-outlined text-[24px] mb-1">crop_landscape</span>
                    <span>16:9 NATIVE</span>
                    <span class="text-[9px] text-text-muted">YOUTUBE MAIN</span>
                </button>
                <button type="button" class="flex flex-col items-center justify-center p-3 rounded-lg glass-panel text-text-muted hover:text-gray-900 text-center border border-black/10">
                    <span class="material-symbols-outlined text-[24px] mb-1">crop_square</span>
                    <span>1:1 SQUARE</span>
                    <span class="text-[9px] text-text-muted">FEED POSTS</span>
                </button>
            </div>
        </section>

        <!-- SUBTITLES & AUDIO CONTROL -->
        <section class="glass-panel rounded-xl p-4 flex flex-col gap-3 font-mono text-[11px]">
            <div class="flex items-center justify-between">
                <span class="text-gray-900 font-bold uppercase">SUBTITLES & ENCODING</span>
                <span class="text-brand-mint font-bold text-[10px]">H.264 AAC</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div class="flex items-center justify-between p-3 rounded-lg glass-panel border border-brand-mint bg-emerald-50">
                    <div>
                        <div class="text-gray-900 font-bold">FONT: SPACE GROTESK</div>
                        <div class="text-text-muted text-[10px]">HIGH RETENTION</div>
                    </div>
                    <span class="w-2.5 h-2.5 rounded-full bg-brand-mint pulse-mint"></span>
                </div>
                <div class="flex items-center justify-between p-3 rounded-lg glass-panel border border-black/10 text-text-muted">
                    <div>
                        <div class="text-gray-900 font-medium">FONT: JETBRAINS MONO</div>
                        <div class="text-text-muted text-[10px]">TECH MONOSPACE</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SAVE PRESET PIPELINE BUTTON -->
        <button class="w-full btn-mint font-display font-extrabold text-sm py-4 rounded-xl uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer text-white" type="button">
            <span class="material-symbols-outlined text-[18px]">save</span>
            <span>SAVE PIPELINE PRESET</span>
        </button>

    </div>

</main>

<!-- BOTTOM NAVIGATION BAR -->
<nav class="fixed bottom-0 left-0 right-0 z-50 glass-panel border-t border-black/5 px-6 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between font-mono text-[10px]">
        <a href="/index.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined text-[20px]">cloud_upload</span>
            <span>UPLOAD</span>
        </a>
        <a href="/library.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined text-[20px]">video_library</span>
            <span>LIBRARY</span>
        </a>
        <a href="/presets.html" class="flex flex-col items-center gap-1 text-brand-mint font-bold">
            <span class="material-symbols-outlined text-[20px]">tune</span>
            <span>PRESETS</span>
        </a>
        <a href="/engine.html" class="flex flex-col items-center gap-1 text-text-muted hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined text-[20px]">settings_input_component</span>
            <span>ENGINE</span>
        </a>
    </div>
</nav>

<script src="/js/app.js"></script>
</body>
</html>
